<!doctype html>
<!-- One flag and nothing else, for another site's iframe. Everything it shows comes from its own address, the same
     attributes <hata-flag> takes: embed.html?code=JP-13&shape=round&size=48&lang=ja&border=1&shadow=1&theme=dark
     (after a # works too). It stores nothing, tracks nothing and loads nothing from anywhere else. When the flag is
     drawn it tells the page around it: postMessage({ hata: "load", code }), or { hata: "error", code, reason }. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>Hata · a flag</title>
    <meta name="description" content="One flag, drawn at its true proportions, for another site's iframe; its address says which." />
    <style>
      html, body { margin: 0; background: transparent; }
      body { padding: 4px; line-height: 0; }
      kazoku-page-credits { display: block; line-height: normal; }
      kazoku-page-credits[hidden] { display: none; }
    </style>
  </head>
  <body>
    <hata-flag id="flag" loading="eager"></hata-flag>
    <!-- The credit line, shown only for a drawing whose licence asks for credit (CC BY); a flag that owes none keeps its
         frame its own size and loads nothing more. -->
    <kazoku-page-credits id="credits" embed hidden></kazoku-page-credits>
    <script type="module">
      import "./dist/element-define.js";
      import { OWED } from "./embed-credits.js";
      const element = document.getElementById("flag");
      const credits = document.getElementById("credits");
      const credit = async () => {
        const owed = OWED[`${(element.getAttribute("code") ?? "JP").toUpperCase()}|${element.getAttribute("variant") ?? ""}`];
        credits.hidden = owed === undefined;
        if (owed === undefined) return;
        await import("./kazoku-page-frame.js");
        credits.setAttribute("credits", owed.en);
        credits.setAttribute("credits-ja", owed.ja);
        credits.setAttribute("href", owed.href);
      };
      const ATTRIBUTES = ["code", "shape", "size", "fit", "variant", "label", "theme", "border", "shadow"];
      const FLAGS = ["border", "shadow"];
      const draw = () => {
        const query = new URLSearchParams(location.hash.length > 1 ? location.hash.slice(1) : location.search.slice(1));
        const lang = query.get("lang");
        if (lang === "en" || lang === "ja") document.documentElement.lang = lang;
        for (const name of ATTRIBUTES) {
          const value = query.get(name);
          if (FLAGS.includes(name)) element.toggleAttribute(name, value !== null && value !== "0" && value !== "false");
          else if (value === null || value === "") element.removeAttribute(name);
          else element.setAttribute(name, value);
        }
      };
      const tell = (message) => parent !== window && parent.postMessage(message, "*");
      element.addEventListener("hata-load", (event) => tell({ hata: "load", code: event.detail.code }));
      element.addEventListener("hata-error", (event) => tell({ hata: "error", code: event.detail.code, reason: event.detail.reason }));
      addEventListener("hashchange", () => {
        draw();
        void credit();
      });
      draw();
      void credit();
    </script>
  </body>
</html>
