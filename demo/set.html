<!doctype html>
<html lang="en">
  <head>
    <!--family:head-->
    <link rel="stylesheet" href="family.css" />
    <link rel="stylesheet" href="set.css" />
  </head>
  <body>
    <main class="family-page" data-ready="false">
      <!-- family:setHeader -->
      <!--frame:header-->
      <section class="fam-panel set-intro">
        <p data-say="intro"></p>
      </section>
      <section class="fam-panel set-tools" aria-label="Filter">
        <div class="fam-row">
          <label class="fam-label" for="search" data-say="search"></label>
          <input type="search" id="search" class="fam-field" data-testid="search" autocomplete="off" />
        </div>
        <div class="fam-row" id="chips-row">
          <span class="fam-label" id="kind-label" data-say="kind"></span>
          <div class="set-chips" id="chips" role="group" aria-labelledby="kind-label" data-testid="chips"></div>
        </div>
        <div class="fam-row" id="spell-row" hidden>
          <label class="fam-label" for="spell" id="spell-label"></label>
          <input type="text" id="spell" class="fam-field" data-testid="spell" autocomplete="off" />
        </div>
        <p class="fam-fine" id="count" data-testid="count" aria-live="polite"></p>
      </section>
      <ul class="set-hoist" id="hoist" data-testid="hoist" aria-live="polite"></ul>
      <ul class="set-grid" id="grid" data-testid="grid"></ul>
      <p class="fam-empty" id="empty" data-testid="empty" hidden data-say="empty"></p>
      <section class="fam-panel set-detail" id="detail" data-testid="detail" aria-live="polite" hidden></section>
      <!-- family:unreviewed -->
      <!--frame:credits-->
      <!-- family:footer -->
    </main>
    <!-- family:script -->
    <script type="module" src="set.js"></script>
  </body>
</html>
